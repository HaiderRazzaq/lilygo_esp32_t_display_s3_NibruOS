name: Repository validation

on: [push, pull_request]

jobs:
  docs-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate engineering documentation
        run: python tools/check_docs.py
      - name: Test documentation checks
        run: python -m unittest discover -s tests/docs -v
      - name: Run existing mocked firmware tests
        run: bash tests/host/run_tests.sh
      - name: Test resource artifact validation
        run: python -m unittest discover -s tests/resources -v
